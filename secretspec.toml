[project]
name = "wokesy"
revision = "1.0"

[profiles.default]
WOKESY_ZULIP__SITE = { description = "Zulip organization URL, for example https://example.zulipchat.com", required = true, prompt = true }
WOKESY_ZULIP__EMAIL = { description = "Email address of the wokesy Zulip bot, which must be a Generic bot", required = true, prompt = true }
WOKESY_ZULIP__API_KEY = { description = "API key of the wokesy Zulip bot", required = true, prompt = true }
WOKESY_PAGERDUTY__TOKEN = { description = "PagerDuty REST API key with read/write access; wokesy reads users, escalation policies, and who is on call, and creates and deletes schedule overrides on legacy schedules and custom shifts on shift-based schedules, so a read-only key is not enough", required = true, prompt = true }
WOKESY_PAGERDUTY__EVENTS__ROUTING_KEY = { description = "Routing key (integration key) of an Events API v2 integration on the PagerDuty service that `page` should alert; paging is off without it", required = false }
WOKESY_ANNOUNCEMENTS__CHANNEL = { description = "Zulip channel where wokesy announces who is on call and every page", required = true, prompt = true }
WOKESY_ANNOUNCEMENTS__TOPIC = { description = "Topic in the announcements channel; `on call` when unset", required = false }
WOKESY_ON_CALL__ESCALATION_POLICIES = { description = "PagerDuty escalation policies that wokesy shows and announces, as their ids separated by commas, for example `PANZZEQ, PT20YPA`; an id is the `P…` code in the escalation policy's PagerDuty URL; every policy that a service uses when unset", required = false }
WOKESY_PEOPLE__LINKS = { description = "Explicit links from a person's PagerDuty email to their Zulip user id, for people whose email and full name differ between the two: comma-separated `email=zulip_user_id` pairs, for example `alice@example.com=12, bob@example.com=34`", required = false }
WOKESY_WAKE__SCHEDULES = { description = "PagerDuty schedules that `wake me` puts the sender on, as their ids separated by commas, for example `PI7DH85`; an id is the `P…` code in the schedule's PagerDuty URL; name a schedule with nobody on it that is level 1 of the escalation policy; wokesy creates an override on a legacy schedule and a custom shift on a shift-based schedule, changes no other schedule, and `wake me` is off without it", required = false }
WOKESY_WAKE__CHANNELS = { description = "Zulip channels where wokesy takes commands, separated by commas, for example `sysadmin, on-call`; only the announcements channel when unset", required = false }
WOKESY_STATUS__CHANNEL = { description = "Zulip channel where wokesy posts its startup, PagerDuty health, and shutdown; they are only logged when unset", required = false }
OTEL_EXPORTER_OTLP_ENDPOINT = { description = "OTLP collector URL; telemetry is exported only when set", required = false }
OTEL_EXPORTER_OTLP_HEADERS = { description = "OTLP request headers, such as collector credentials", required = false }

[profiles.development]
